name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.2", "3.3", "3.4"]
        os: ["ubuntu-latest","windows-latest","macos-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      # TEMP: load libpact_ffi 0.5.13-rc.1 (YOU54F/pact-reference fork prerelease),
      # fetched by the YOU54F/pact-ruby-ffi PR branch's download script, through
      # pact-ffi's DEBUG_TARGET override (revert before merge)
      - name: Use pact_ffi 0.5.13-rc.1 from YOU54F/pact-ruby-ffi
        shell: bash
        run: |
          git clone --depth 1 --branch fix/repeated-headers-rfc9110 https://github.com/YOU54F/pact-ruby-ffi.git ../pact-ruby-ffi
          cd ../pact-ruby-ffi
          ruby script/download_libs.rb
          echo "DEBUG_TARGET=$(ruby -r ./lib/pact/detect_os -e 'print File.expand_path(DetectOS.get_bin_path)')" >> "$GITHUB_ENV"
      - name: Check loaded pact_ffi version
        shell: bash
        run: bundle exec ruby -e 'require "pact/ffi"; v = PactFfi.version; puts "DEBUG_TARGET=#{ENV["DEBUG_TARGET"]} pact_ffi=#{v}"; abort "expected pact_ffi 0.5.13-rc.1" unless v == "0.5.13-rc.1"'
      - uses: pact-foundation/pact-cli@575a793b515ad65718cfb81198b3a4634dc8f72d # main
      - run: pact plugin install --yes https://github.com/mefellows/pact-matt-plugin/releases/tag/v0.1.1
      - run: pact plugin install --yes avro --version 0.1.3
      - name: Test Pact-Ruby Specs
        run: "bundle exec rake"
      - name: Test Pact-Ruby Consumer Tests
        run: "bundle exec rake pact:spec"
      - name: Test Pact-Ruby Provider Verification
        run: "bundle exec rake pact:verify"
      - name: Test Pact-Ruby Zoo App Specs
        run: "bundle install && bundle exec rake spec"
        working-directory: example/zoo-app
      - name: Test Pact-Ruby v2 Animal Service Specs
        run: "bundle install && bundle exec rake pact:verify"
        if: matrix.os != 'windows-latest'
        working-directory: example/animal-service

  test-with-rack-2:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.2", "3.3", "3.4"]
        os: ["ubuntu-latest","windows-latest","macos-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      # TEMP: load libpact_ffi 0.5.13-rc.1 (YOU54F/pact-reference fork prerelease),
      # fetched by the YOU54F/pact-ruby-ffi PR branch's download script, through
      # pact-ffi's DEBUG_TARGET override (revert before merge)
      - name: Use pact_ffi 0.5.13-rc.1 from YOU54F/pact-ruby-ffi
        shell: bash
        run: |
          git clone --depth 1 --branch fix/repeated-headers-rfc9110 https://github.com/YOU54F/pact-ruby-ffi.git ../pact-ruby-ffi
          cd ../pact-ruby-ffi
          ruby script/download_libs.rb
          echo "DEBUG_TARGET=$(ruby -r ./lib/pact/detect_os -e 'print File.expand_path(DetectOS.get_bin_path)')" >> "$GITHUB_ENV"
      - name: Check loaded pact_ffi version
        shell: bash
        run: bundle exec ruby -e 'require "pact/ffi"; v = PactFfi.version; puts "DEBUG_TARGET=#{ENV["DEBUG_TARGET"]} pact_ffi=#{v}"; abort "expected pact_ffi 0.5.13-rc.1" unless v == "0.5.13-rc.1"'
      - uses: pact-foundation/pact-cli@575a793b515ad65718cfb81198b3a4634dc8f72d # main
      - run: pact plugin install --yes https://github.com/mefellows/pact-matt-plugin/releases/tag/v0.1.1
      - run: "bundle exec appraisal install"
      - run: "bundle exec appraisal rack-2 rake"
      - name: Test Mixed Pacts (Http/Kafaka/Grpc)
        run: "bundle exec appraisal rack-2 rake pact:spec"
      - name: Verify Mixed Pacts (Http/Kafaka/Grpc)
        run: "bundle exec appraisal rack-2 rake pact:verify"
        if: matrix.os != 'windows-latest'