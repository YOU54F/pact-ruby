name: Compatibility suite (V4 plugins)

# The V4 plugin features are not in a released suite yet, so this checks out
# the suite branch that adds them and runs compatibility-suite/run-plugins.sh
# against it. It runs on PRs to any base, unlike test.yml.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      suite-repository:
        description: pact-compatibility-suite repository with features/V4/plugins
        default: YOU54F/pact-compatibility-suite
      suite-ref:
        description: Ref of that repository to run
        default: feat/plugin-features

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PACT_DO_NOT_TRACK: 'true'
  SUITE_REPOSITORY: ${{ inputs.suite-repository || 'YOU54F/pact-compatibility-suite' }}
  SUITE_REF: ${{ inputs.suite-ref || 'feat/plugin-features' }}

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout plugin suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SUITE_REPOSITORY }}
          ref: ${{ env.SUITE_REF }}
          path: pact-compatibility-suite-plugins
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: pact-foundation/pact-cli@575a793b515ad65718cfb81198b3a4634dc8f72d # main
      # matt is not in the plugin repository index, so it is installed from its release.
      - run: pact plugin install --yes https://github.com/mefellows/pact-matt-plugin/releases/tag/v0.1.1
      - run: pact plugin install --yes csv --version 0.0.6
      - run: pact plugin install --yes avro --version 0.1.3
      - run: pact plugin install --yes protobuf --version 0.8.0
      - name: Run plugin features
        run: compatibility-suite/run-plugins.sh
        env:
          PACT_COMPAT_SUITE: ${{ github.workspace }}/pact-compatibility-suite-plugins
